# Global mise config: settings + version-pinned tools.
# This file (~/.config/mise/config.toml) is mise's true global config —
# it applies regardless of cwd. ~/.tool-versions does not: mise resolves
# it via directory-walk like any idiomatic/local config, so it's only
# picked up when cwd is inside $HOME or a descendant (cd /, /tmp, /home,
# etc. lose every tool). Tool versions live here for that reason.

[settings]
auto_install = true
# Auto-detect versions from project files
idiomatic_version_file_enable_tools = ["node", "go", "python"]

[tools]
# Core languages and Python workflow
node = "22.21.0"
python = "3.12"
go = "1.24"
uv = "latest"

# Infrastructure and cloud
terraform = "1.15.3"
terraform-docs = "0.20"
terragrunt = "1.0.4"
kubectl = "1.32"
helm = "3.17"
kustomize = "5.6"
awscli = "2"
sops = "3.10"
age = "1.2"
vault = "latest"
k9s = "v0.40.0"
infracost = "latest"
lazydocker = "latest"
kubectx = "latest"
kubens = "latest"
kubecm = "latest"
lazygit = "latest"
bat = "latest"
neovim = "latest"
atuin = "latest"
eza = "latest"
fastfetch = "latest"
zoxide = "latest"

# Versioned CLI utilities
jq = "1.7"
yq = "4.45"
shellcheck = "0.10"
shfmt = "3.11"
yamllint = "1.37"
pre-commit = "4.2"
"npm:openskills" = "latest"
